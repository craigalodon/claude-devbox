version: 2
updates:
  # The workflow's actions are pinned to commit SHAs; this keeps the pins current.
  # (The image has no lockable dependencies: its base image and tools are fetched at build time,
  # and the weekly CI build catches breakage there.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
